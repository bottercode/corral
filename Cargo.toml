[package]
name = "corral-agents"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
authors = ["bottercode"]
license = "MIT"
repository = "https://github.com/bottercode/corral"
homepage = "https://github.com/bottercode/corral"
readme = "README.md"
description = "A terminal runtime for coding agents"
keywords = ["terminal", "agents", "tui", "multiplexer"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "corral"
path = "src/lib.rs"

[[bin]]
name = "corral"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal", "user", "term", "fs", "socket"] }
portable-pty = "0.9"
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.38"
thiserror = "2"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = "0.3.4"
unicode-width = "0.2"
ureq = "3"
vt100 = "0.16"

[dev-dependencies]
insta = "1.49"
tempfile = "3"

# Used by cargo-dist for release builds.
[profile.dist]
inherits = "release"
lto = "thin"

# vt100 with Codex-style history kept in scrollback (see vendor/README.md).
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

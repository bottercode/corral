[package]
name = "corral-agents"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
authors = ["bottercode"]
license = "MIT"
repository = "https://github.com/bottercode/corral"
homepage = "https://github.com/bottercode/corral"
readme = "README.md"
description = "A terminal runtime for coding agents, with optional per-agent git worktrees"
keywords = ["terminal", "agents", "tui", "multiplexer", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "corral"
path = "src/lib.rs"

[[bin]]
name = "corral"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
futures = "0.3"
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal", "user", "term", "fs"] }
portable-pty = "0.9"
ratatui = "0.30"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.38"
thiserror = "2"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = "0.3.4"
unicode-width = "0.2"
ureq = "3"
vt100 = "0.16"

[dev-dependencies]
insta = "1.49"
tempfile = "3"

# Used by cargo-dist for release builds.
[profile.dist]
inherits = "release"
lto = "thin"

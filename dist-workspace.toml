# Release configuration for cargo-dist (https://opensource.axo.dev/cargo-dist/).
# Not active yet: nothing is published until releases are approved. When they
# are, run `dist generate` to create .github/workflows/release.yml, then tag
# a version (git tag v0.1.0 && git push --tags).

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
install-updater = false

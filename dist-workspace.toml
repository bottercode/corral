# Release configuration for cargo-dist (https://opensource.axo.dev/cargo-dist/).
# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) runs
# .github/workflows/release.yml, which builds the binaries and the installer
# and attaches them to a GitHub Release. After changing this file, run
# `dist generate` to update the workflow.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
install-updater = false
